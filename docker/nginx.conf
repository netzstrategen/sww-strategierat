# Die Datenschutzerklärung sagt: keine Server-Protokolle. Deshalb ist access_log aus.
# Fehler landen nur mit Stufe "crit" im Container-Log, ohne IP-Adressen von Besuchern.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log off;
  error_log /dev/stderr crit;
  server_tokens off;

  # Optionaler Zugangsschutz. Die Datei schreibt docker/40-basic-auth.sh beim Containerstart (leer = öffentlich).
  include /etc/nginx/auth.conf;

  # Sicherheits-Header. Alles kommt vom eigenen Server; Inline-Styles nur für style-Attribute.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  # Gehashte Build-Dateien und Schriften lange cachen, HTML nicht.
  # Bewusst "expires" statt add_header: ein add_header im location-Block würde die Sicherheits-Header oben verwerfen.
  location /_astro/ { expires 1y; try_files $uri =404; }
  location /fonts/  { expires 1y; try_files $uri =404; }
  location / { try_files $uri $uri/ =404; }

  error_page 404 /404.html;
}
